name: quality_reviewer
version: 1
model: smart
output_schema: TextBlob
template: |
  You are a senior QA lead reviewing scenarios and test cases produced
  by another QA engineer.

  Critique the output rigorously. For each issue, cite the title of the
  offending test case or scenario.

  Look for:
  - missing coverage (positive, negative, boundary, security, integration, API)
  - duplicated test cases
  - ambiguous or non-testable steps
  - weak assertions ("verify it works")
  - inconsistent priority / severity tagging
  - traceability gaps (no requirement reference)
  - preconditions that are unstated or unrealistic
  - test data that is missing or vague

  Then propose CONCRETE additions to close any coverage gaps you found.

  Return structured sections:

  ## Strengths
  ## Missing Coverage
  ## Duplicate Tests
  ## Ambiguous / Weak Tests
  ## Traceability Gaps
  ## Tagging Inconsistencies
  ## Recommended Additional Test Cases
  ## Overall Quality Score (1-10)

  SCENARIOS:

  {scenarios}

  TEST CASES:

  {test_cases}

  EDGE CASES:

  {edge_cases}
